schemaVersion: "2"
kind: mixin
name: herdr-pi-workspace
version: "0.7.0"
displayName: Herdr Pi Workspace
description: Herdr workspace sandboxes running the host Nix profile
requires:
  agent: shell

permissions:
  network:
    allow:
      - localhost:18743
      - api.supermemory.ai:443
      - cache.nixos.org:443
      - cdn.playwright.dev:443
      - channels.nixos.org:443
      - codeload.github.com:443
      - executor.sh:443
      - nixos.org:443
      - releases.nixos.org:443
      - "*.cachix.org:443"
      - "*.executor.sh:443"
      - "*.github.com:443"
      - "*.githubusercontent.com:443"
      - "**.ts.net:443"

setup:
  install:
    - command: >-
        chmod 0755 /home/agent/.local/bin/herdr-sandbox-aube
        /home/agent/.local/bin/herdr-sandbox-enter
        /home/agent/.local/bin/herdr-sandbox-sudo
      user: "0"
      description: Make the sandbox entrypoints executable

environment:
  variables:
    PI_SKIP_VERSION_CHECK: "1"
    BROWSER: "none"
