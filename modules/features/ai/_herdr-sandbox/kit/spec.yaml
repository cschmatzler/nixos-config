schemaVersion: "2"
kind: mixin
name: herdr-pi-workspace
version: "1.0.3"
displayName: Herdr Pi Workspace
description: Home Manager Fish and scoped Herdr access for Pi
requires:
  agent: shell

permissions:
  network:
    allow:
      - localhost:18743
      - chatgpt.com:443
      - auth.openai.com:443
      - api.openai.com:443
      - api.anthropic.com:443
      - claude.ai:443
      - github.com:443
      - api.github.com:443
      - codeload.github.com:443
      - raw.githubusercontent.com:443
      - objects.githubusercontent.com:443
      - release-assets.githubusercontent.com:443
      - cache.nixos.org:443
      - devenv.cachix.org:443
      - registry.npmjs.org:443
      - pypi.org:443
      - files.pythonhosted.org:443
      - crates.io:443
      - index.crates.io:443
      - static.crates.io:443
      - archive.ubuntu.com:80
      - security.ubuntu.com:80
      - download.docker.com:443
      - registry-1.docker.io:443
      - auth.docker.io:443
      - production.cloudfront.docker.com:443
      - production.cloudflare.docker.com:443
      - cdn.playwright.dev:443
      - playwright.download.prss.microsoft.com:443
      - executor.manticore-hippocampus.ts.net:443
      - api.supermemory.ai:443

setup:
  install:
    - command: chmod 0755 /home/agent/.local/bin/herdr-sandbox-fish
      user: "0"
      description: Make the Fish entrypoint executable

environment:
  variables:
    PI_SKIP_VERSION_CHECK: "1"
    BROWSER: "none"
